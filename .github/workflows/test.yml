name: MeetClone Automated Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt pytest-cov

      - name: Run Pytest Suite with Coverage
        run: |
          cd backend
          pytest --cov=meetings --cov-report=term-missing --cov-fail-under=60

  frontend-tests:
    name: Frontend Jest & Playwright E2E
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-python@v5
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Set up Python for Backend API in E2E
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Run Jest Unit & Component Tests
        run: |
          cd frontend
          npm test

      - name: Install Playwright Chromium Browser
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Start Backend Server for E2E Tests
        run: |
          cd backend
          pip install -r requirements.txt
          python manage.py migrate
          python manage.py runserver 8000 &
        env:
          DJANGO_SETTINGS_MODULE: meetclone.settings

      - name: Run Playwright E2E Tests
        run: |
          cd frontend
          npx playwright test

      - name: Upload Playwright HTML Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
