name: MeetClone Automated Test Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-tests:
    name: Backend Pytest Suite
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: "backend/requirements.txt"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest-cov

      - name: Run Pytest Suite with Coverage
        env:
          DJANGO_SETTINGS_MODULE: meetclone.settings
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          pytest --cov=meetings --cov-report=term-missing --cov-fail-under=60

  frontend-unit-tests:
    name: Frontend Jest Unit Tests
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Install Dependencies
        run: npm ci

      - name: Run Jest Unit & Component Tests
        run: npm test

  frontend-e2e-tests:
    name: Frontend Playwright E2E
    runs-on: ubuntu-latest
    needs: [backend-tests, frontend-unit-tests]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: "frontend/package-lock.json"

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt

      - name: Prepare Backend (Migrate + Seed)
        env:
          DJANGO_SETTINGS_MODULE: meetclone.settings
          PYTHONPATH: ${{ github.workspace }}/backend
        run: |
          cd backend
          python manage.py migrate --run-syncdb
          python manage.py seed

      - name: Start Backend Server
        env:
          DJANGO_SETTINGS_MODULE: meetclone.settings
          PYTHONPATH: ${{ github.workspace }}/backend
          DEBUG: "true"
        run: |
          cd backend
          python manage.py runserver 0.0.0.0:8000 &
          # Wait for backend to be ready
          for i in $(seq 1 30); do
            curl -s http://127.0.0.1:8000/health && break
            sleep 1
          done

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm ci

      - name: Install Playwright Chromium
        run: |
          cd frontend
          npx playwright install --with-deps chromium

      - name: Run Playwright E2E Tests
        env:
          NEXT_PUBLIC_API_URL: http://127.0.0.1:8000
          NEXT_PUBLIC_WS_URL: ws://127.0.0.1:8000
        run: |
          cd frontend
          npx playwright test

      - name: Upload Playwright Report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: frontend/playwright-report/
          retention-days: 14
